<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Stream Generator</title>

<style>

/* =========================
   BASE
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #080808;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
}


/* =========================
   NAVIGATION
========================= */

.nav {
    width: 100%;
    height: 72px;
    border-bottom: 1px solid #202020;
    display: flex;
    align-items: center;
}

.nav-inner {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 28px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    color: #ffffff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 25px;
}

.nav-link {
    color: #999;
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s ease;
}

.nav-link:hover {
    color: #ffffff;
}


/* =========================
   PAGE
========================= */

.page {
    width: 100%;
    min-height: calc(100vh - 72px);
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 780px;
    padding: 70px 24px 90px;
}


/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    margin-bottom: 48px;
}

.header h1 {
    margin: 0;

    font-size: 42px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -1px;
}

.header p {
    margin: 15px 0 0;

    color: #8d8d8d;
    font-size: 16px;
    line-height: 1.6;
}


/* =========================
   MAIN CARD
========================= */

.card {
    width: 100%;

    background: #111111;
    border: 1px solid #292929;
    border-radius: 18px;

    padding: 32px;

    box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.35);

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}

.card:hover {
    border-color: #353535;

    box-shadow:
        0 22px 55px rgba(0, 0, 0, 0.42);
}

.card h2 {
    margin: 0 0 30px;

    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
}


/* =========================
   FORM
========================= */

.time-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.field {
    margin-bottom: 22px;
}

label {
    display: block;

    font-size: 13px;
    font-weight: 600;
    color: #cfcfcf;

    margin-bottom: 9px;

    letter-spacing: 0.2px;
}

input,
textarea {
    width: 100%;

    background: #090909;
    color: #ffffff;

    border: 1px solid #303030;
    border-radius: 10px;

    padding: 14px 15px;

    font-size: 15px;
    font-family: inherit;

    outline: none;

    transition:
        border-color 0.2s ease,
        background 0.2s ease;
}

input:hover,
textarea:hover {
    border-color: #414141;
}

input:focus,
textarea:focus {
    border-color: #666666;
    background: #0b0b0b;
}

textarea {
    resize: vertical;
    min-height: 115px;
    line-height: 1.5;
}


/* =========================
   DURATION
========================= */

.duration {
    width: 100%;

    background: #090909;

    border: 1px solid #242424;
    border-radius: 10px;

    padding: 19px;

    text-align: center;

    font-size: 24px;
    font-weight: 700;

    letter-spacing: 0.4px;

    margin: 2px 0 25px;
}


/* =========================
   GENERATE BUTTON
========================= */

.generate-button {
    width: 100%;

    border: none;
    border-radius: 10px;

    padding: 16px;

    background: #ffffff;
    color: #000000;

    font-size: 14px;
    font-weight: 700;

    letter-spacing: 0.5px;

    cursor: pointer;

    transition:
        transform 0.15s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
}

.generate-button:hover {
    background: #eeeeee;

    box-shadow:
        0 8px 25px rgba(255, 255, 255, 0.08);
}

.generate-button:active {
    transform: scale(0.985);
}


/* =========================
   RESULTS
========================= */

.results {
    display: none;
    margin-top: 24px;
}

.result-card {
    width: 100%;

    background: #111111;
    border: 1px solid #292929;
    border-radius: 18px;

    padding: 32px;

    box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.35);
}

.result-section {
    margin-bottom: 34px;
}

.result-section:last-child {
    margin-bottom: 0;
}

.result-section h3 {
    margin: 0 0 11px;

    font-size: 14px;
    font-weight: 600;

    color: #d0d0d0;

    letter-spacing: 0.2px;
}


/* =========================
   OUTPUT
========================= */

.output {
    background: #090909;

    border: 1px solid #292929;
    border-radius: 10px;

    padding: 16px;

    white-space: pre-wrap;
    line-height: 1.55;

    word-break: break-word;

    font-size: 14px;
    color: #eeeeee;
}


/* =========================
   COPY BUTTON
========================= */

.button-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.small-button {
    width: 100%;

    border: 1px solid #303030;
    border-radius: 9px;

    padding: 12px;

    font-size: 12px;
    font-weight: 700;

    letter-spacing: 0.4px;

    cursor: pointer;

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease,
        transform 0.15s ease;
}

.copy-button {
    background: #181818;
    color: #ffffff;
}

.copy-button:hover {
    background: #202020;
    border-color: #414141;
}

.copy-button:active {
    transform: scale(0.985);
}

.copy-button.copied {
    background: #ffffff;
    color: #000000;
    border-color: #ffffff;
}


/* =========================
   NOTE
========================= */

.note {
    color: #666666;

    font-size: 12px;
    line-height: 1.5;

    margin-top: 10px;
}


/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;

    margin-top: 55px;

    color: #555555;

    font-size: 12px;
    letter-spacing: 0.2px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .nav {
        height: 64px;
    }

    .nav-inner {
        padding: 0 20px;
    }

    .nav-right {
        gap: 17px;
    }

    .nav-link {
        font-size: 13px;
    }

    .page {
        min-height: calc(100vh - 64px);
    }

    .container {
        padding: 48px 16px 65px;
    }

    .header {
        margin-bottom: 34px;
    }

    .header h1 {
        font-size: 31px;
        letter-spacing: -0.6px;
    }

    .header p {
        font-size: 14px;
        margin-top: 12px;
    }

    .card,
    .result-card {
        padding: 22px;
        border-radius: 15px;
    }

    .card h2 {
        font-size: 20px;
        margin-bottom: 25px;
    }

    .time-grid {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .duration {
        font-size: 22px;
    }

}


/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

    html {
        scroll-behavior: auto;
    }

    *,
    *::before,
    *::after {
        transition: none !important;
    }

}

</style>

</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<nav class="nav">

    <div class="nav-inner">

        <a
            href="https://aditya20490.github.io/"
            class="logo"
        >
            ADITYA
        </a>

        <div class="nav-right">

            <a
                href="https://aditya20490.github.io/"
                class="nav-link"
            >
                Home
            </a>

            <a
                href="https://github.com/aditya20490"
                class="nav-link"
                target="_blank"
                rel="noopener"
            >
                GitHub ↗
            </a>

        </div>

    </div>

</nav>


<!-- =========================
     PAGE
========================= -->

<div class="page">

<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>Study Stream Generator</h1>

        <p>
            Generate your stream details in seconds.
        </p>

    </div>


    <!-- GENERATOR -->

    <div class="card">

        <h2>New Study Session</h2>


        <div class="time-grid">


            <div class="field">

                <label for="startTime">
                    Start Time
                </label>

                <input
                    type="time"
                    id="startTime"
                    value="17:00"
                >

            </div>


            <div class="field">

                <label for="endTime">
                    End Time
                </label>

                <input
                    type="time"
                    id="endTime"
                    value="19:30"
                >

            </div>


        </div>


        <div
            class="duration"
            id="duration"
        >
            2 HOURS 30 MIN
        </div>


        <div class="field">

            <label for="target">
                Today's Study Target
            </label>

            <textarea
                id="target"
                placeholder="Example: Physics - NLM&#10;Chemistry - Atomic Structure&#10;Maths - Straight Lines"
            ></textarea>

        </div>


        <button
            class="generate-button"
            onclick="generateStream()"
        >
            GENERATE STREAM
        </button>


    </div>


    <!-- RESULTS -->

    <div
        class="results"
        id="results"
    >

        <div class="result-card">


            <!-- TITLE -->

            <div class="result-section">

                <h3>Title</h3>

                <div
                    class="output"
                    id="titleOutput"
                ></div>

                <div class="button-row">

                    <button
                        class="small-button copy-button"
                        onclick="copyText('titleOutput', this)"
                    >
                        COPY TITLE
                    </button>

                </div>

            </div>


            <!-- DESCRIPTION -->

            <div class="result-section">

                <h3>Description</h3>

                <div
                    class="output"
                    id="descriptionOutput"
                ></div>

                <div class="button-row">

                    <button
                        class="small-button copy-button"
                        onclick="copyText('descriptionOutput', this)"
                    >
                        COPY DESCRIPTION
                    </button>

                </div>

            </div>


            <!-- GEMINI PROMPT -->

            <div class="result-section">

                <h3>Gemini Thumbnail Prompt</h3>

                <div
                    class="output"
                    id="promptOutput"
                ></div>

                <div class="button-row">

                    <button
                        class="small-button copy-button"
                        onclick="copyText('promptOutput', this)"
                    >
                        COPY GEMINI PROMPT
                    </button>

                </div>

                <div class="note">

                    Attach your original thumbnail to Gemini,
                    then paste this prompt.

                </div>

            </div>


        </div>

    </div>


    <div class="footer">

        Built by ADITYA

    </div>


</div>

</div>


<script>


/* =========================
   TEMPLATES
========================= */

const TITLE_TEMPLATE =
    "Study With Me | {DURATION} Session | JEE 2028";


const DESCRIPTION_TEMPLATE =
`Study with me for a focused {DURATION} JEE 2028 study session.

🕐 Session: {START} – {END}
📚 JEE 2028 Preparation
🎧 No talking • Deep focus

Today's targets:
{TARGET}

Grab your books and study along with me.

#JEE2028 #StudyWithMe #JEE`;


/* =========================
   CALCULATE DURATION
========================= */

function calculateDuration() {

    const start =
        document.getElementById(
            "startTime"
        ).value;


    const end =
        document.getElementById(
            "endTime"
        ).value;


    if (!start || !end) {
        return null;
    }


    const startParts =
        start.split(":");


    const endParts =
        end.split(":");


    let startMinutes =
        Number(startParts[0]) * 60 +
        Number(startParts[1]);


    let endMinutes =
        Number(endParts[0]) * 60 +
        Number(endParts[1]);


    if (endMinutes <= startMinutes) {
        endMinutes += 1440;
    }


    const totalMinutes =
        endMinutes - startMinutes;


    const hours =
        Math.floor(
            totalMinutes / 60
        );


    const minutes =
        totalMinutes % 60;


    return {
        hours: hours,
        minutes: minutes
    };

}


/* =========================
   DURATION TEXT
========================= */

function durationText(duration) {

    let result = "";


    if (duration.hours > 0) {

        result +=
            duration.hours +
            " HOUR";


        if (duration.hours !== 1) {
            result += "S";
        }

    }


    if (duration.minutes > 0) {

        if (result !== "") {
            result += " ";
        }


        result +=
            duration.minutes +
            " MIN";

    }


    return result;

}


/* =========================
   FORMAT TIME
========================= */

function formatTime(time) {

    const parts =
        time.split(":");


    let hour =
        Number(parts[0]);


    const minute =
        Number(parts[1]);


    const suffix =
        hour >= 12
            ? "PM"
            : "AM";


    hour =
        hour % 12;


    if (hour === 0) {
        hour = 12;
    }


    return (
        hour +
        ":" +
        String(minute).padStart(2, "0") +
        " " +
        suffix
    );

}


/* =========================
   UPDATE DURATION
========================= */

function updateDuration() {

    const duration =
        calculateDuration();


    if (!duration) {
        return;
    }


    document.getElementById(
        "duration"
    ).textContent =
        durationText(duration);

}


/* =========================
   THUMBNAIL PROMPT
========================= */

function generateThumbnailPrompt(
    durationString
) {

    return `Edit the attached thumbnail while preserving the original design exactly. Do not redesign, restyle, crop, resize, or change the composition. Keep the same black-and-white visual style, typography style, character, positioning, icons, lighting, colors, background, and overall layout.
Only replace the existing duration text "6 HOUR" with "${durationString}".
Keep the new duration in exactly the same location, font style, size, weight, alignment, spacing, and white color as the original duration text. Make the replacement look naturally integrated into the original thumbnail.
Do not add any new elements. Do not remove or modify anything else. The final image should look identical to the attached original thumbnail except for the updated duration.
Output as a YouTube thumbnail in the original 16:9 format. You don't have to help with images of people, and don't depict some public figures.`;

}


/* =========================
   GENERATE STREAM
========================= */

function generateStream() {

    const start =
        document.getElementById(
            "startTime"
        ).value;


    const end =
        document.getElementById(
            "endTime"
        ).value;


    const target =
        document.getElementById(
            "target"
        ).value.trim();


    const duration =
        calculateDuration();


    if (!duration) {

        return;
    }


    const durationString =
        durationText(duration);


    const formattedStart =
        formatTime(start);


    const formattedEnd =
        formatTime(end);


    const title =
        TITLE_TEMPLATE
        .replaceAll(
            "{DURATION}",
            durationString
        );


    const description =
        DESCRIPTION_TEMPLATE
        .replaceAll(
            "{DURATION}",
            durationString
        )
        .replaceAll(
            "{START}",
            formattedStart
        )
        .replaceAll(
            "{END}",
            formattedEnd
        )
        .replaceAll(
            "{TARGET}",
            target ||
            "Focused JEE 2028 preparation"
        );


    const thumbnailPrompt =
        generateThumbnailPrompt(
            durationString
        );


    document.getElementById(
        "titleOutput"
    ).textContent =
        title;


    document.getElementById(
        "descriptionOutput"
    ).textContent =
        description;


    document.getElementById(
        "promptOutput"
    ).textContent =
        thumbnailPrompt;


    document.getElementById(
        "results"
    ).style.display =
        "block";


    document.getElementById(
        "results"
    ).scrollIntoView({
        behavior: "smooth"
    });

}


/* =========================
   COPY
========================= */

function copyText(elementId, button) {

    const text =
        document.getElementById(
            elementId
        ).textContent;


    navigator.clipboard
        .writeText(text)
        .then(
            function() {

                const originalText =
                    button.textContent;


                button.textContent =
                    "COPIED ✓";


                button.classList.add(
                    "copied"
                );


                setTimeout(
                    function() {

                        button.textContent =
                            originalText;


                        button.classList.remove(
                            "copied"
                        );

                    },
                    1200
                );

            }
        )
        .catch(
            function() {

                /* No popup.
                   Copy simply fails silently. */

            }
        );

}


/* =========================
   EVENTS
========================= */

document
    .getElementById("startTime")
    .addEventListener(
        "change",
        updateDuration
    );


document
    .getElementById("endTime")
    .addEventListener(
        "change",
        updateDuration
    );


/* INITIAL DURATION */

updateDuration();

</script>


</body>

</html>
