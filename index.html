<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Stream Generator</title>

<!-- Font for thumbnail -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: min(780px, calc(100% - 32px));
    margin: 50px auto;
}


/* =========================================================
   HEADER
========================================================= */

h1 {
    margin: 0;
    font-size: 32px;
    letter-spacing: -1px;
}

.subtitle {
    margin-top: 8px;
    color: #888;
    font-size: 15px;
}


/* =========================================================
   CARD
========================================================= */

.card {
    margin-top: 28px;
    padding: 24px;
    background: #0d0d0d;
    border: 1px solid #222;
    border-radius: 14px;
}

.card h2 {
    margin-top: 0;
    font-size: 20px;
}


/* =========================================================
   FORM
========================================================= */

label {
    display: block;
    margin-top: 20px;
    margin-bottom: 8px;
    color: #aaa;
    font-size: 14px;
}

input,
textarea {
    width: 100%;
    padding: 13px 14px;
    border-radius: 9px;
    border: 1px solid #292929;
    background: #080808;
    color: white;
    outline: none;
    font-size: 15px;
}

input:focus,
textarea:focus {
    border-color: #555;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

.time-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}


/* =========================================================
   DURATION
========================================================= */

.duration {
    margin-top: 14px;
    padding: 12px;
    background: #111;
    border-radius: 8px;
    color: #aaa;
    font-size: 14px;
}

.duration strong {
    color: white;
}


/* =========================================================
   BUTTONS
========================================================= */

button {
    border: 0;
    border-radius: 9px;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.generate-btn {
    width: 100%;
    margin-top: 22px;
    background: white;
    color: black;
}

.generate-btn:hover {
    background: #ddd;
}

.generate-btn:disabled {
    opacity: 0.5;
    cursor: wait;
}


/* =========================================================
   RESULTS
========================================================= */

.result {
    display: none;
    margin-top: 28px;
}

.result-section {
    margin-bottom: 28px;
}

.result-label {
    margin-bottom: 8px;
    color: #888;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
}


/* =========================================================
   RESULT BOX
========================================================= */

.result-box {
    padding: 15px;
    background: #090909;
    border: 1px solid #222;
    border-radius: 9px;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 14px;
}


/* =========================================================
   COPY BUTTON

   IMPORTANT:
   The button is OUTSIDE the text box visually.
========================================================= */

.copy-btn {
    display: block;
    margin-top: 8px;

    padding: 7px 12px;

    background: #1d1d1d;
    color: white;

    border: 1px solid #292929;
    border-radius: 7px;

    font-size: 12px;
}

.copy-btn:hover {
    background: #2a2a2a;
}


/* =========================================================
   THUMBNAIL
========================================================= */

.thumbnail-wrapper {
    margin-top: 10px;
    overflow: hidden;
    border-radius: 10px;
    border: 1px solid #222;
    background: #000;
}

#thumbnailPreview {
    display: block;
    width: 100%;
    height: auto;
}

.download-btn {
    width: 100%;
    margin-top: 12px;
    background: white;
    color: black;
}

.download-btn:hover {
    background: #ddd;
}


/* =========================================================
   LOADING
========================================================= */

.status {
    display: none;
    margin-top: 15px;
    text-align: center;
    color: #999;
    font-size: 14px;
}

.spinner {
    display: inline-block;

    width: 13px;
    height: 13px;

    border: 2px solid #555;
    border-top-color: white;

    border-radius: 50%;

    animation: spin 0.8s linear infinite;

    vertical-align: -2px;
    margin-right: 6px;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================================================
   FOOTER
========================================================= */

footer {
    margin-top: 35px;
    text-align: center;
    color: #555;
    font-size: 13px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .container {
        margin: 30px auto;
    }

    h1 {
        font-size: 26px;
    }

    .time-row {
        grid-template-columns: 1fr;
    }

</style>

<body>

<div class="container">


    <!-- =====================================================
         HEADER

        ================================================== -->

        <!-- =================================================

        ================================================== -->

        <div class="result-section">

    <!-- =====================================================

    ====================================================== -->

    <footer>

    </footer>

</div>



<script>

/* =========================================================
   CONFIGURATION
========================================================= */

/*
    Your master thumbnail must be in the same folder
    as this index.html file.
*/

const MASTER_THUMBNAIL =
    "master-thumbnail.png";


/*
    Your uploaded master image is:

    1536 × 865
*/

const CANVAS_WIDTH = 1536;
const CANVAS_HEIGHT = 865;


/*
    Stores the currently generated PNG URL.
*/

let generatedThumbnailURL = null;



/* =========================================================
   DATE
========================================================= */

function getTodayDate() {

    const today = new Date();


    const day =
        String(
            today.getDate()
        ).padStart(2, "0");


    const months = [

        "JANUARY",
        "FEBRUARY",
        "MARCH",
        "APRIL",
        "MAY",
        "JUNE",
        "JULY",
        "AUGUST",
        "SEPTEMBER",
        "OCTOBER",
        "NOVEMBER",
        "DECEMBER"

    ];


    const month =
        months[
            today.getMonth()
        ];


    const year =
        today.getFullYear();


    return `${day} ${month} ${year}`;
}



/* =========================================================
   CALCULATE DURATION
========================================================= */

function calculateDuration() {

    const start =
        document.getElementById(
            "startTime"
        ).value;


    const end =
        document.getElementById(
            "endTime"
        ).value;


    if (!start || !end) {
        return 0;
    }


    const [
        startHour,
        startMinute
    ] =
        start
            .split(":")
            .map(Number);


    const [
        endHour,
        endMinute
    ] =
        end
            .split(":")
            .map(Number);


    let startTotal =
        startHour * 60 +
        startMinute;


    let endTotal =
        endHour * 60 +
        endMinute;


    /*
        Supports overnight sessions.
    */

    if (endTotal <= startTotal) {

        endTotal += 1440;

    }


    return endTotal - startTotal;
}



/* =========================================================
   DURATION TEXT
========================================================= */

function durationText(totalMinutes) {

    const hours =
        Math.floor(
            totalMinutes / 60
        );


    const minutes =
        totalMinutes % 60;


    let result = "";


    if (hours > 0) {

        result +=
            `${hours} HOUR`;


        if (hours !== 1) {

            result += "S";

        }

    }


    if (minutes > 0) {

        if (result) {

            result += " ";

        }


        result +=
            `${minutes} MIN`;

    }


    return result || "0 MIN";
}



/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(time) {

    const [
        hour,
        minute
    ] =
        time
            .split(":")
            .map(Number);


    const suffix =
        hour >= 12
            ? "PM"
            : "AM";


    let displayHour =
        hour % 12;


    if (displayHour === 0) {

        displayHour = 12;

    }


    return (
        `${displayHour}:` +
        `${String(minute).padStart(2, "0")} ` +
        suffix
    );
}



/* =========================================================
   UPDATE LIVE DURATION
========================================================= */

function updateDuration() {

    const minutes =
        calculateDuration();


    document.getElementById(
        "durationDisplay"
    ).textContent =
        durationText(minutes);
}


document
    .getElementById("startTime")
    .addEventListener(
        "change",
        updateDuration
    );


document
    .getElementById("endTime")
    .addEventListener(
        "change",
        updateDuration
    );


updateDuration();



/* =========================================================
   TITLE GENERATOR
========================================================= */

function generateTitle(
    duration,
    date
) {

    return (
        `Study With Me | ` +
        `${duration} Session | ` +
        `${date} | ` +
        `JEE 2028`
    );
}



/* =========================================================
   DESCRIPTION GENERATOR
========================================================= */

function generateDescription(
    duration,
    start,
    end,
    date,
    target
) {

    return (
`Study with me for a focused ${duration} JEE 2028 study session.

📅 Date: ${date}
🕐 Session: ${start} → ${end}
📚 JEE 2028 Preparation
🎧 No talking • Deep focus

Today's targets:
${target || "Focused JEE 2028 preparation"}

Grab your books and study along with me.

#JEE2028 #StudyWithMe #JEE`
    );
}



/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImage(src) {

    return new Promise(
        (resolve, reject) => {

            const image =
                new Image();


            image.onload =
                () => resolve(image);


            image.onerror =
                () => {

                    reject(
                        new Error(
                            "master-thumbnail.png could not be loaded. Make sure it is in the same folder as index.html."
                        )
                    );

                };


            image.src = src;

        }
    );
}



/* =========================================================
   LOAD FONT
========================================================= */

async function loadThumbnailFont() {

    try {

        await document.fonts.load(
            '100px "Anton"'
        );

    }

    catch (error) {

        console.log(
            "Anton font could not be loaded. Using fallback."
        );

    }
}



/* =========================================================
   MEASURE LETTER-SPACED TEXT
========================================================= */

function measureLetterSpacedText(
    ctx,
    text,
    spacing
) {

    let width = 0;


    for (const char of text) {

        width +=
            ctx.measureText(char).width;

    }


    /*
        Add spacing between characters,
        but not after the final character.
    */

    width +=
        Math.max(
            0,
            text.length - 1
        ) * spacing;


    return width;
}



/* =========================================================
   FIND FITTING FONT SIZE
========================================================= */

function fitLetterSpacedText(
    ctx,
    text,
    maxWidth,
    startingSize,
    spacing
) {

    let size =
        startingSize;


    while (size > 20) {

        ctx.font =
            `normal ${size}px "Anton", Impact, sans-serif`;


        const width =
            measureLetterSpacedText(
                ctx,
                text,
                spacing
            );


        if (
            width <= maxWidth
        ) {

            break;

        }


        size--;

    }


    return size;
}



/* =========================================================
   DRAW LETTER-SPACED TEXT
========================================================= */

function drawLetterSpacedText(
    ctx,
    text,
    x,
    top,
    maxWidth,
    startingSize,
    spacing
) {

    const size =
        fitLetterSpacedText(
            ctx,
            text,
            maxWidth,
            startingSize,
            spacing
        );


    ctx.font =
        `normal ${size}px "Anton", Impact, sans-serif`;


    ctx.textAlign =
        "left";


    ctx.textBaseline =
        "top";


    ctx.fillStyle =
        "#ffffff";


    /*
        Very subtle shadow.
    */

    ctx.shadowColor =
        "rgba(0,0,0,0.15)";

    ctx.shadowBlur = 1;

    ctx.shadowOffsetX = 0;

    ctx.shadowOffsetY = 1;


    let currentX =
        x;


    /*
        Draw each character individually
        to control letter spacing.
    */

    for (
        const char of text
    ) {

        ctx.fillText(
            char,
            currentX,
            top
        );


        currentX +=
            ctx.measureText(char).width +
            spacing;

    }


    /*
        Reset shadow.
    */

    ctx.shadowColor =
        "transparent";

    ctx.shadowBlur = 0;

    ctx.shadowOffsetX = 0;

    ctx.shadowOffsetY = 0;


    return {

        size: size,

        height: size

    };
}



/* =========================================================
   DRAW TIME LINE
=========================================================

   This is specially handled because the arrow should
   sit vertically in the CENTER of the text rather than
   sitting on the text baseline.
========================================================= */

function drawTimeLine(
    ctx,
    start,
    end,
    x,
    top,
    maxWidth,
    startingSize
) {

    /*
        Slight letter spacing.
    */

    const spacing = 2.5;


    let size =
        startingSize;


    /*
        Keep reducing font size until
        the complete line fits.
    */

    while (size > 20) {

        ctx.font =
            `normal ${size}px "Anton", Impact, sans-serif`;


        const startWidth =
            measureLetterSpacedText(
                ctx,
                start,
                spacing
            );


        const endWidth =
            measureLetterSpacedText(
                ctx,
                end,
                spacing
            );


        ctx.font =
            `normal ${size}px Arial, sans-serif`;


        const arrowWidth =
            ctx.measureText("→").width;


        const totalWidth =
            startWidth +
            arrowWidth +
            48 +
            20;


        if (
            totalWidth <= maxWidth
        ) {

            break;

        }


        size--;

    }


    /*
        Measure final text.
    */

    ctx.font =
        `normal ${size}px "Anton", Impact, sans-serif`;


    const startWidth =
        measureLetterSpacedText(
            ctx,
            start,
            spacing
        );


    const endWidth =
        measureLetterSpacedText(
            ctx,
            end,
            spacing
        );


    ctx.font =
        `normal ${size}px Arial, sans-serif`;


    const arrowWidth =
        ctx.measureText("→").width;


    /*
        Gap around arrow.
    */

    const gap =
        24;


    /*
        Total line width.
    */

    const totalWidth =
        startWidth +
        gap +
        arrowWidth +
        gap +
        endWidth;


    /*
        Start at supplied X.
    */

    let currentX =
        x;


    /*
        White text.
    */

    ctx.fillStyle =
        "#ffffff";


    ctx.shadowColor =
        "rgba(0,0,0,0.15)";

    ctx.shadowBlur = 1;

    ctx.shadowOffsetX = 0;

    ctx.shadowOffsetY = 1;


    /*
        Draw START time.
    */

    ctx.font =
        `normal ${size}px "Anton", Impact, sans-serif`;

    ctx.textBaseline =
        "top";


    for (
        const char of start
    ) {

        ctx.fillText(
            char,
            currentX,
            top
        );


        currentX +=
            ctx.measureText(char).width +
            spacing;

    }


    /*
        Move to arrow.
    */

    currentX += gap;


    /*
        The arrow uses a normal sans-serif font.
        This gives it a cleaner shape and allows
        us to center it vertically.
    */

    ctx.font =
        `normal ${size}px Arial, sans-serif`;


    const arrowMetrics =
        ctx.measureText("→");


    const arrowAscent =
        arrowMetrics.actualBoundingBoxAscent ||
        size * 0.75;


    const arrowDescent =
        arrowMetrics.actualBoundingBoxDescent ||
        size * 0.20;


    /*
        Find center of the surrounding text.
    */

    const textCenter =
        top +
        size * 0.50;


    /*
        Position arrow around that center.
    */

    const arrowBaseline =
        textCenter +
        (
            arrowAscent -
            arrowDescent
        ) / 2;


    ctx.textBaseline =
        "alphabetic";


    ctx.fillText(
        "→",
        currentX,
        arrowBaseline
    );


    /*
        Move past arrow.
    */

    currentX +=
        arrowWidth +
        gap;


    /*
        Draw END time.
    */

    ctx.font =
        `normal ${size}px "Anton", Impact, sans-serif`;


    ctx.textBaseline =
        "top";


    for (
        const char of end
    ) {

        ctx.fillText(
            char,
            currentX,
            top
        );


        currentX +=
            ctx.measureText(char).width +
            spacing;

    }


    /*
        Reset shadow.
    */

    ctx.shadowColor =
        "transparent";

    ctx.shadowBlur = 0;

    ctx.shadowOffsetX = 0;

    ctx.shadowOffsetY = 0;
}



/* =========================================================
   CREATE THUMBNAIL
========================================================= */

async function createThumbnail(
    duration,
    start,
    end,
    date
) {

    /*
        Make sure Anton is loaded.
    */

    await loadThumbnailFont();


    /*
        Load master image.
    */

    const image =
        await loadImage(
            MASTER_THUMBNAIL
        );


    /*
        Create canvas.
    */

    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        CANVAS_WIDTH;


    canvas.height =
        CANVAS_HEIGHT;


    const ctx =
        canvas.getContext(
            "2d"
        );


    /*
        Draw the master artwork.
    */

    ctx.drawImage(
        image,
        0,
        0,
        CANVAS_WIDTH,
        CANVAS_HEIGHT
    );


    /* =====================================================
       THUMBNAIL TEXT SETTINGS
    ====================================================== */

    /*
        Left edge based on your actual thumbnail.
    */

    const x = 78;


    /*
        Dynamic text should stay on the left side,
        away from the character.
    */

    const maxWidth = 1050;


    /*
        This controls the additional breathing room
        between individual letters.

        Increase to 3.5 if you want more spacing.
    */

    const letterSpacing = 2.5;



    /* =====================================================
       STUDY WITH ME
    ====================================================== */

    drawLetterSpacedText(
        ctx,

        "STUDY WITH ME",

        x,

        82,

        maxWidth,

        118,

        letterSpacing
    );



    /* =====================================================
       DURATION
    ====================================================== */

    drawLetterSpacedText(
        ctx,

        duration,

        x,

        223,

        maxWidth,

        125,

        letterSpacing
    );



    /* =====================================================
       SESSION
    ====================================================== */

    drawLetterSpacedText(
        ctx,

        "SESSION",

        x,

        389,

        maxWidth,

        118,

        letterSpacing
    );



    /* =====================================================
       TIME
    ====================================================== */

    drawTimeLine(
        ctx,

        start,

        end,

        x,

        535,

        maxWidth,

        67
    );



    /* =====================================================
       DATE
    ====================================================== */

    drawLetterSpacedText(
        ctx,

        date,

        x,

        625,

        maxWidth,

        67,

        letterSpacing
    );



    /* =====================================================
       EXPORT PNG
    ====================================================== */

    return new Promise(
        (resolve, reject) => {

            canvas.toBlob(

                blob => {

                    if (!blob) {

                        reject(
                            new Error(
                                "Could not create PNG."
                            )
                        );

                        return;
                    }


                    resolve(blob);

                },

                "image/png",

                1

            );

        }
    );
}



/* =========================================================
   MAIN GENERATOR
========================================================= */

async function generateEverything() {

    const button =
        document.getElementById(
            "generateBtn"
        );


    const status =
        document.getElementById(
            "status"
        );


    const result =
        document.getElementById(
            "result"
        );


    /*
        Get inputs.
    */

    const startValue =
        document.getElementById(
            "startTime"
        ).value;


    const endValue =
        document.getElementById(
            "endTime"
        ).value;


    const target =
        document.getElementById(
            "target"
        ).value.trim();



    /*
        Validate time.
    */

    if (
        !startValue ||
        !endValue
    ) {

        alert(
            "Please select both start and end times."
        );

        return;
    }



    /*
        Calculate duration.
    */

    const minutes =
        calculateDuration();


    if (
        minutes <= 0
    ) {

        alert(
            "Please enter a valid session duration."
        );

        return;
    }



    /*
        Format everything.
    */

    const duration =
        durationText(
            minutes
        );


    const start =
        formatTime(
            startValue
        );


    const end =
        formatTime(
            endValue
        );


    const date =
        getTodayDate();



    /*
        Show loading.
    */

    button.disabled =
        true;


    status.style.display =
        "block";


    result.style.display =
        "none";



    try {

        /*
            Title.
        */

        const title =
            generateTitle(
                duration,
                date
            );


        /*
            Description.
        */

        const description =
            generateDescription(
                duration,
                start,
                end,
                date,
                target
            );


        /*
            Generate actual PNG.
        */

        const thumbnailBlob =
            await createThumbnail(
                duration,
                start,
                end,
                date
            );


        /*
            Remove old object URL.
        */

        if (
            generatedThumbnailURL
        ) {

            URL.revokeObjectURL(
                generatedThumbnailURL
            );

        }


        /*
            Create new object URL.
        */

        generatedThumbnailURL =
            URL.createObjectURL(
                thumbnailBlob
            );



        /*
            Put title into UI.
        */

        document.getElementById(
            "titleOutput"
        ).textContent =
            title;



        /*
            Put description into UI.
        */

        document.getElementById(
            "descriptionOutput"
        ).textContent =
            description;



        /*
            Put thumbnail into UI.
        */

        document.getElementById(
            "thumbnailPreview"
        ).src =
            generatedThumbnailURL;



        /*
            Show result.
        */

        result.style.display =
            "block";



        /*
            Smoothly scroll to result.
        */

        result.scrollIntoView({

            behavior: "smooth",

            block: "start"

        });

    }


    catch (error) {

        console.error(
            error
        );


        alert(
            "Thumbnail generation failed.\n\n" +
            error.message
        );

    }


    finally {

        button.disabled =
            false;


        status.style.display =
            "none";

    }

}



/* =========================================================
   COPY TEXT
========================================================= */

async function copyText(
    elementId,
    button
) {

    const text =
        document.getElementById(
            elementId
        ).textContent;


    try {

        await navigator.clipboard.writeText(
            text
        );


        const originalText =
            button.textContent;


        button.textContent =
            "Copied!";


        setTimeout(
            () => {

                button.textContent =
                    originalText;

            },

            1200
        );

    }

    catch (error) {

        /*
            Fallback for browsers where
            clipboard API isn't available.
        */

        const textArea =
            document.createElement(
                "textarea"
            );


        textArea.value =
            text;


        document.body.appendChild(
            textArea
        );


        textArea.select();


        document.execCommand(
            "copy"
        );


        textArea.remove();


        const originalText =
            button.textContent;


        button.textContent =
            "Copied!";


        setTimeout(
            () => {

                button.textContent =
                    originalText;

            },

            1200
        );

    }

}



/* =========================================================
   DOWNLOAD THUMBNAIL
========================================================= */

function downloadThumbnail() {

    if (
        !generatedThumbnailURL
    ) {

        return;

    }


    const date =
        getTodayDate();


    const filename =
        `JEE-2028-Study-With-Me-${date.replaceAll(" ", "-")}.png`;


    const link =
        document.createElement(
            "a"
        );


    link.href =
        generatedThumbnailURL;


    link.download =
        filename;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();

}
