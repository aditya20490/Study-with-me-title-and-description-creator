<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Stream Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: min(780px, calc(100% - 32px));
    margin: 50px auto;
}


/* =========================================================
   HEADER
========================================================= */

h1 {
    margin: 0;
    font-size: 32px;
    letter-spacing: -1px;
}

.subtitle {
    margin-top: 8px;
    color: #888;
    font-size: 15px;
}


/* =========================================================
   CARD
========================================================= */

.card {
    margin-top: 28px;
    padding: 24px;
    background: #0d0d0d;
    border: 1px solid #222;
    border-radius: 14px;
}

.card h2 {
    margin-top: 0;
    font-size: 20px;
}


/* =========================================================
   FORM
========================================================= */

label {
    display: block;
    margin-top: 20px;
    margin-bottom: 8px;
    color: #aaa;
    font-size: 14px;
}

input,
textarea {
    width: 100%;
    padding: 13px 14px;
    border-radius: 9px;
    border: 1px solid #292929;
    background: #080808;
    color: white;
    outline: none;
    font-size: 15px;
}

input:focus,
textarea:focus {
    border-color: #555;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

.time-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}


/* =========================================================
   DURATION
========================================================= */

.duration {
    margin-top: 14px;
    padding: 12px;
    background: #111;
    border-radius: 8px;
    color: #aaa;
    font-size: 14px;
}

.duration strong {
    color: white;
}


/* =========================================================
   GENERATE BUTTON
========================================================= */

button {
    border: 0;
    border-radius: 9px;
    cursor: pointer;
    font-weight: 700;
}

.generate-btn {
    width: 100%;
    margin-top: 22px;
    padding: 14px 18px;
    background: white;
    color: black;
    font-size: 15px;
}

.generate-btn:hover {
    background: #ddd;
}

.generate-btn:disabled {
    opacity: 0.5;
    cursor: wait;
}


/* =========================================================
   RESULTS
========================================================= */

.result {
    display: none;
    margin-top: 28px;
}

.result-section {
    margin-bottom: 30px;
}

.result-label {
    margin-bottom: 9px;
    color: #888;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
}


/* =========================================================
   TEXT BOX
========================================================= */

.result-box {
    padding: 16px;
    background: #090909;
    border: 1px solid #222;
    border-radius: 9px;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 14px;
}


/* =========================================================
   BIG WHITE COPY BUTTONS
========================================================= */

.copy-btn {
    display: block;

    width: 150px;

    margin-top: 12px;

    padding: 11px 18px;

    background: #ffffff;
    color: #000000;

    border: 1px solid #ffffff;
    border-radius: 8px;

    font-size: 14px;
    font-weight: 700;

    transition:
        background 0.15s ease,
        transform 0.1s ease;
}

.copy-btn:hover {
    background: #dddddd;
}

.copy-btn:active {
    transform: scale(0.97);
}


/* =========================================================
   THUMBNAIL
========================================================= */

.thumbnail-wrapper {
    margin-top: 10px;
    overflow: hidden;
    border-radius: 10px;
    border: 1px solid #222;
    background: #000;
}

#thumbnailPreview {
    display: block;
    width: 100%;
    height: auto;
}

.download-btn {
    width: 100%;
    margin-top: 12px;
    padding: 14px 18px;

    background: white;
    color: black;

    font-size: 15px;
}

.download-btn:hover {
    background: #ddd;
}


/* =========================================================
   LOADING
========================================================= */

.status {
    display: none;
    margin-top: 15px;
    text-align: center;
    color: #999;
    font-size: 14px;
}

.spinner {
    display: inline-block;

    width: 13px;
    height: 13px;

    border: 2px solid #555;
    border-top-color: white;

    border-radius: 50%;

    animation: spin 0.8s linear infinite;

    vertical-align: -2px;
    margin-right: 6px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    margin-top: 35px;
    text-align: center;
    color: #555;
    font-size: 13px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .container {
        margin: 30px auto;
    }

    h1 {
        font-size: 26px;
    }

    .time-row {
        grid-template-columns: 1fr;
    }

    .copy-btn {
        width: 100%;
    }
}

</style>
</head>


<body>

<div class="container">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <h1>Study Stream Generator</h1>

    <div class="subtitle">
        Generate your YouTube study stream details and thumbnail.
    </div>


    <!-- =====================================================
         INPUT
    ====================================================== -->

    <div class="card">

        <h2>New Study Session</h2>


        <div class="time-row">

            <div>

                <label for="startTime">
                    Start Time
                </label>

                <input
                    type="time"
                    id="startTime"
                    value="07:00"
                >

            </div>


            <div>

                <label for="endTime">
                    End Time
                </label>

                <input
                    type="time"
                    id="endTime"
                    value="12:30"
                >

            </div>

        </div>


        <div class="duration">

            Duration:

            <strong id="durationDisplay">
                5 HOUR 30 MIN
            </strong>

        </div>


        <label for="target">

        </label>

            id="target"
            placeholder="Example: Complete Electrostatics lectures and solve PYQs."
        ></textarea>


        <button
            class="generate-btn"
            id="generateBtn"
            onclick="generateEverything()"
        >
            Generate
        </button>

            class="status"
            id="status"
        >
            <span class="spinner"></span>
            Generating thumbnail...
        </div>

    </div>



    <!-- =====================================================
         RESULTS
    ====================================================== -->

    <div
        class="card result"
        id="result"
    >


        <!-- TITLE -->

        <div class="result-section">

            <div class="result-label">
                Title
            </div>

            <div
                class="result-box"
                id="titleOutput"
            ></div>

            <button
                class="copy-btn"
                onclick="copyText('titleOutput', this)"
            >
                Copy
            </button>

        </div>



        <!-- DESCRIPTION -->

        <div class="result-section">

            <div class="result-label">
                Description
            </div>

            <div
                class="result-box"
                id="descriptionOutput"
            ></div>

            <button
                class="copy-btn"
                onclick="copyText('descriptionOutput', this)"
            >
                Copy
            </button>

        </div>



        <!-- THUMBNAIL -->

        <div class="result-section">

            <div class="result-label">
                Thumbnail
            </div>

            <div class="thumbnail-wrapper">

                <img
                    id="thumbnailPreview"
                    alt="Generated study stream thumbnail"
                >

            </div>

            <button
                class="download-btn"
                onclick="downloadThumbnail()"
            >
                Download Thumbnail
            </button>

        </div>

    </div>



    <footer>
        Built by ADITYA
    </footer>

</div>



<script>

/* =========================================================
   CONFIG
========================================================= */

const MASTER_THUMBNAIL =
    "master-thumbnail.png";

const CANVAS_WIDTH = 1536;
const CANVAS_HEIGHT = 865;

let generatedThumbnailURL = null;


/* =========================================================
   JEE MAIN 2028 REFERENCE DATE
=========================================================

   Estimated reference date:
   24 January 2028

   This is NOT an official NTA-announced date.
   It is used only for the automatic countdown.
========================================================= */

const JEE_MAIN_2028_DATE =
    new Date("2028-01-24T00:00:00");


/* =========================================================
   JEE MAIN 2028 DAYS LEFT
========================================================= */

function getJeeMainDaysLeft() {

    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );

    const difference =
        JEE_MAIN_2028_DATE - today;

    return Math.ceil(
        difference /
        (1000 * 60 * 60 * 24)
    );
}


/* =========================================================
   DATE
========================================================= */

function getTodayDate() {

    const today = new Date();

    const day =
        String(today.getDate())
        .padStart(2, "0");

    const months = [
        "JANUARY",
        "FEBRUARY",
        "MARCH",
        "APRIL",
        "MAY",
        "JUNE",
        "JULY",
        "AUGUST",
        "SEPTEMBER",
        "OCTOBER",
        "NOVEMBER",
        "DECEMBER"
    ];

    const month =
        months[today.getMonth()];

    const year =
        today.getFullYear();

    return `${day} ${month} ${year}`;
}


/* =========================================================
   CALCULATE DURATION
========================================================= */

function calculateDuration() {

    const start =
        document.getElementById("startTime").value;

    const end =
        document.getElementById("endTime").value;

    if (!start || !end) {
        return 0;
    }

    const [
        startHour,
        startMinute
    ] = start.split(":").map(Number);

    const [
        endHour,
        endMinute
    ] = end.split(":").map(Number);

    let startTotal =
        startHour * 60 +
        startMinute;

    let endTotal =
        endHour * 60 +
        endMinute;

    if (endTotal <= startTotal) {
        endTotal += 1440;
    }

    return endTotal - startTotal;
}


/* =========================================================
   DURATION TEXT
=========================================================

   IMPORTANT:
   Your thumbnail template specifically uses:

   5 HOUR 30 MIN

   NOT:

   5 HOURS 30 MIN

   So "HOUR" is intentionally kept singular.
========================================================= */

function durationText(totalMinutes) {

    const hours =
        Math.floor(totalMinutes / 60);

    const minutes =
        totalMinutes % 60;

    let result = "";

    if (hours > 0) {

        result +=
            `${hours} HOUR`;

    }

    if (minutes > 0) {

        if (result) {
            result += " ";
        }

        result +=
            `${minutes} MIN`;
    }

    return result || "0 MIN";
}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(time) {

    const [
        hour,
        minute
    ] = time.split(":").map(Number);

    const suffix =
        hour >= 12 ? "PM" : "AM";

    let displayHour =
        hour % 12;

    if (displayHour === 0) {
        displayHour = 12;
    }

    return (
        `${displayHour}:` +
        `${String(minute).padStart(2, "0")} ` +
        suffix
    );
}


/* =========================================================
   LIVE DURATION
========================================================= */

function updateDuration() {

    const minutes =
        calculateDuration();

    document.getElementById(
        "durationDisplay"
    ).textContent =
        durationText(minutes);
}


document
    .getElementById("startTime")
    .addEventListener(
        "change",
        updateDuration
    );

document
    .getElementById("endTime")
    .addEventListener(
        "change",
        updateDuration
    );

updateDuration();


/* =========================================================
   TITLE
========================================================= */

function generateTitle(
    duration,
    date
) {

    const daysLeft =
        getJeeMainDaysLeft();

    return (
        `Study With Me | ` +
        `${duration} Session | ` +
        `${daysLeft} Days Left for JEE Main 2028 | ` +
        `${date}`
    );
}


/* =========================================================
   DESCRIPTION
========================================================= */

function generateDescription(
    duration,
    start,
    end,
    date,
    target
) {

    const daysLeft =
        getJeeMainDaysLeft();

    return (
`Study with me for a focused ${duration} JEE 2028 study session.

📅 Date: ${date}
🕐 Session: ${start} → ${end}
📚 JEE 2028 Preparation
⏳ ${daysLeft} Days Left for JEE Main 2028
🎧 No talking • Deep focus

Today's targets:
${target || "Focused JEE 2028 preparation"}

Estimated JEE Main 2028 Session 1 reference date: 24 January 2028.

Grab your books and study along with me.

#JEE2028 #StudyWithMe #JEE`
    );
}


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImage(src) {

    return new Promise(
        (resolve, reject) => {

            const image =
                new Image();

            image.onload =
                () => resolve(image);

            image.onerror =
                () => reject(
                    new Error(
                        "master-thumbnail.png could not be loaded. Make sure it is in the same folder as index.html."
                    )
                );

            image.src = src;
        }
    );
}


/* =========================================================
   LOAD FONT
========================================================= */

async function loadThumbnailFont() {

    try {

        await document.fonts.load(
            '100px "Anton"'
        );

    } catch (error) {

        console.log(
            "Anton font unavailable. Using fallback."
        );

    }
}


/* =========================================================
   LETTER-SPACED TEXT WIDTH
========================================================= */

function measureLetterSpacedText(
    ctx,
    text,
    spacing
) {

    let width = 0;

    for (const char of text) {

        width +=
            ctx.measureText(char).width;
    }

    width +=
        Math.max(
            0,
            text.length - 1
        ) * spacing;

    return width;
}


/* =========================================================
   FIT FONT
========================================================= */

function fitLetterSpacedText(
    ctx,
    text,
    maxWidth,
    startingSize,
    spacing
) {

    let size =
        startingSize;

    while (size > 20) {

        ctx.font =
            `normal ${size}px "Anton", Impact, sans-serif`;

        const width =
            measureLetterSpacedText(
                ctx,
                text,
                spacing
            );

        if (width <= maxWidth) {
            break;
        }

        size--;
    }

    return size;
}


/* =========================================================
   DRAW NORMAL TEXT
========================================================= */

function drawLetterSpacedText(
    ctx,
    text,
    x,
    y,
    maxWidth,
    startingSize,
    spacing
) {

    const size =
        fitLetterSpacedText(
            ctx,
            text,
            maxWidth,
            startingSize,
            spacing
        );

    ctx.font =
        `normal ${size}px "Anton", Impact, sans-serif`;

    ctx.fillStyle =
        "#ffffff";

    ctx.textAlign =
        "left";

    ctx.textBaseline =
        "top";

    ctx.shadowColor =
        "rgba(0,0,0,0.15)";

    ctx.shadowBlur = 1;

    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 1;

    let currentX = x;

    for (const char of text) {

        ctx.fillText(
            char,
            currentX,
            y
        );

        currentX +=
            ctx.measureText(char).width +
            spacing;
    }

    ctx.shadowColor =
        "transparent";

    ctx.shadowBlur = 0;

    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;

    return size;
}


/* =========================================================
   DRAW TIME LINE
========================================================= */

function drawTimeLine(
    ctx,
    start,
    end,
    x,
    centerY,
    maxWidth,
    startingSize
) {

    const spacing = 2.5;
    const gap = 25;

    let size =
        startingSize;


    /* ---------------------------------------------
       Find a size that fits
    --------------------------------------------- */

    while (size > 20) {

        ctx.font =
            `normal ${size}px "Anton", Impact, sans-serif`;

        const startWidth =
            measureLetterSpacedText(
                ctx,
                start,
                spacing
            );

        const endWidth =
            measureLetterSpacedText(
                ctx,
                end,
                spacing
            );

        ctx.font =
            `normal ${size}px Arial, sans-serif`;

        const arrowWidth =
            ctx.measureText("→").width;

        const totalWidth =
            startWidth +
            endWidth +
            arrowWidth +
            gap * 2;

        if (totalWidth <= maxWidth) {
            break;
        }

        size--;
    }


    /* ---------------------------------------------
       Final measurements
    --------------------------------------------- */

    ctx.font =
        `normal ${size}px "Anton", Impact, sans-serif`;

    const startWidth =
        measureLetterSpacedText(
            ctx,
            start,
            spacing
        );

    const endWidth =
        measureLetterSpacedText(
            ctx,
            end,
            spacing
        );

    ctx.font =
        `normal ${size}px Arial, sans-serif`;

    const arrowWidth =
        ctx.measureText("→").width;


    /* ---------------------------------------------
       Draw everything from same vertical center
    --------------------------------------------- */

    let currentX = x;

    ctx.fillStyle =
        "#ffffff";

    ctx.shadowColor =
        "rgba(0,0,0,0.15)";

    ctx.shadowBlur = 1;

    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 1;


    /*
        START TIME
    */

    ctx.font =
        `normal ${size}px "Anton", Impact, sans-serif`;

    ctx.textBaseline =
        "middle";

    for (const char of start) {

        ctx.fillText(
            char,
            currentX,
            centerY
        );

        currentX +=
            ctx.measureText(char).width +
            spacing;
    }


    /*
        GAP
    */

    currentX += gap;


    /*
        ARROW
    */

    ctx.font =
        `normal ${size}px Arial, sans-serif`;

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "→",
        currentX,
        centerY
    );


    currentX +=
        arrowWidth +
        gap;


    /*
        END TIME
    */

    ctx.font =
        `normal ${size}px "Anton", Impact, sans-serif`;

    ctx.textBaseline =
        "middle";

    for (const char of end) {

        ctx.fillText(
            char,
            currentX,
            centerY
        );

        currentX +=
            ctx.measureText(char).width +
            spacing;
    }


    /*
        Reset shadow.
    */

    ctx.shadowColor =
        "transparent";

    ctx.shadowBlur = 0;

    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 0;
}


/* =========================================================
   CREATE THUMBNAIL
========================================================= */

async function createThumbnail(
    duration,
    start,
    end,
    date
) {

    await loadThumbnailFont();


    const image =
        await loadImage(
            MASTER_THUMBNAIL
        );


    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width =
        CANVAS_WIDTH;

    canvas.height =
        CANVAS_HEIGHT;


    const ctx =
        canvas.getContext("2d");


    /*
        Draw original master thumbnail.
    */

    ctx.drawImage(
        image,
        0,
        0,
        CANVAS_WIDTH,
        CANVAS_HEIGHT
    );


    /* =====================================================
       TEXT SETTINGS
    ====================================================== */

    const x = 78;

    const maxWidth = 1050;

    const letterSpacing = 2.5;


    /* =====================================================
       STUDY WITH ME
    ====================================================== */

    drawLetterSpacedText(
        ctx,
        "STUDY WITH ME",
        x,
        72,
        maxWidth,
        118,
        letterSpacing
    );


    /* =====================================================
       DURATION
    ====================================================== */

    drawLetterSpacedText(
        ctx,
        duration,
        x,
        214,
        maxWidth,
        125,
        letterSpacing
    );


    /* =====================================================
       SESSION
    ====================================================== */

    drawLetterSpacedText(
        ctx,
        "SESSION",
        x,
        372,
        maxWidth,
        118,
        letterSpacing
    );


    /* =====================================================
       TIME
    ====================================================== */

    drawTimeLine(
        ctx,
        start,
        end,
        x,
        558,
        maxWidth,
        67
    );


    /* =====================================================
       DATE
    ====================================================== */

    drawLetterSpacedText(
        ctx,
        date,
        x,
        620,
        maxWidth,
        67,
        letterSpacing
    );


    /* =====================================================
       EXPORT
    ====================================================== */

    return new Promise(
        (resolve, reject) => {

            canvas.toBlob(

                blob => {

                    if (!blob) {

                        reject(
                            new Error(
                                "Could not create PNG."
                            )
                        );

                        return;
                    }

                    resolve(blob);

                },

                "image/png",

                1
            );
        }
    );
}


/* =========================================================
   MAIN GENERATOR
========================================================= */

async function generateEverything() {

    const button =
        document.getElementById(
            "generateBtn"
        );

    const status =
        document.getElementById(
            "status"
        );

    const result =
        document.getElementById(
            "result"
        );


    const startValue =
        document.getElementById(
            "startTime"
        ).value;

    const endValue =
        document.getElementById(
            "endTime"
        ).value;

    const target =
        document.getElementById(
            "target"
        ).value.trim();


    if (!startValue || !endValue) {

        alert(
            "Please select both start and end times."
        );

        return;
    }


    const minutes =
        calculateDuration();


    if (minutes <= 0) {

        alert(
            "Please enter a valid session duration."
        );

        return;
    }


    const duration =
        durationText(minutes);

    const start =
        formatTime(startValue);

    const end =
        formatTime(endValue);

    const date =
        getTodayDate();


    button.disabled =
        true;

    status.style.display =
        "block";

    result.style.display =
        "none";


    try {

        /* ---------------------------------------------
           TITLE
        --------------------------------------------- */

        const title =
            generateTitle(
                duration,
                date
            );


        /* ---------------------------------------------
           DESCRIPTION
        --------------------------------------------- */

        const description =
            generateDescription(
                duration,
                start,
                end,
                date,
                target
            );


        /* ---------------------------------------------
           THUMBNAIL
        --------------------------------------------- */

        const thumbnailBlob =
            await createThumbnail(
                duration,
                start,
                end,
                date
            );


        /* ---------------------------------------------
           CLEAN OLD URL
        --------------------------------------------- */

        if (generatedThumbnailURL) {

            URL.revokeObjectURL(
                generatedThumbnailURL
            );
        }


        /* ---------------------------------------------
           CREATE NEW URL
        --------------------------------------------- */

        generatedThumbnailURL =
            URL.createObjectURL(
                thumbnailBlob
            );


        /* ---------------------------------------------
           SHOW TITLE
        --------------------------------------------- */

        document.getElementById(
            "titleOutput"
        ).textContent =
            title;


        /* ---------------------------------------------
           SHOW DESCRIPTION
        --------------------------------------------- */

        document.getElementById(
            "descriptionOutput"
        ).textContent =
            description;


        /* ---------------------------------------------
           SHOW THUMBNAIL
        --------------------------------------------- */

        document.getElementById(
            "thumbnailPreview"
        ).src =
            generatedThumbnailURL;


        /* ---------------------------------------------
           SHOW RESULTS
        --------------------------------------------- */

        result.style.display =
            "block";


        result.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }


    catch (error) {

        console.error(error);

        alert(
            "Thumbnail generation failed.\n\n" +
            error.message
        );

    }


    finally {

        button.disabled =
            false;

        status.style.display =
            "none";
    }
}


/* =========================================================
   COPY
========================================================= */

async function copyText(
    elementId,
    button
) {

    const text =
        document.getElementById(
            elementId
        ).textContent;


    try {

        await navigator.clipboard.writeText(
            text
        );

    }

    catch (error) {

        const textArea =
            document.createElement(
                "textarea"
            );

        textArea.value =
            text;

        document.body.appendChild(
            textArea
        );

        textArea.select();

        document.execCommand(
            "copy"
        );

        textArea.remove();
    }


    const originalText =
        button.textContent;


    button.textContent =
        "Copied!";


    setTimeout(
        () => {

            button.textContent =
                originalText;

        },
        1200
    );
}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadThumbnail() {

    if (!generatedThumbnailURL) {
        return;
    }


    const date =
        getTodayDate();


    const filename =
        `JEE-2028-Study-With-Me-${date.replaceAll(" ", "-")}.png`;


    const link =
        document.createElement(
            "a"
        );

    link.href =
        generatedThumbnailURL;

    link.download =
        filename;


    document.body.appendChild(
        link
    );

    link.click();

    link.remove();
}
