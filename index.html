<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Stream Generator</title>

<!-- Free font used for the thumbnail -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #050505;
        color: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        width: min(780px, calc(100% - 32px));
        margin: 50px auto;
    }

    h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: -1px;
    }

    .subtitle {
        margin-top: 8px;
        color: #888;
        font-size: 15px;
    }

    .card {
        margin-top: 28px;
        padding: 24px;
        background: #0d0d0d;
        border: 1px solid #222;
        border-radius: 14px;
    }

    .card h2 {
        margin-top: 0;
        font-size: 20px;
    }

    label {
        display: block;
        margin-top: 20px;
        margin-bottom: 8px;
        color: #aaa;
        font-size: 14px;
    }

    input,
    textarea {
        width: 100%;
        padding: 13px 14px;
        border-radius: 9px;
        border: 1px solid #292929;
        background: #080808;
        color: white;
        outline: none;
        font-size: 15px;
    }

    input:focus,
    textarea:focus {
        border-color: #555;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    .time-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }

    .duration {
        margin-top: 14px;
        padding: 12px;
        background: #111;
        border-radius: 8px;
        color: #aaa;
        font-size: 14px;
    }

    .duration strong {
        color: white;
    }

    button {
        border: 0;
        border-radius: 9px;
        padding: 13px 18px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
    }

    .generate-btn {
        width: 100%;
        margin-top: 22px;
        background: white;
        color: black;
    }

    .generate-btn:hover {
        background: #ddd;
    }

    .generate-btn:disabled {
        opacity: 0.5;
        cursor: wait;
    }

    .result {
        display: none;
        margin-top: 28px;
    }

    .result-section {
        margin-bottom: 25px;
    }

    .result-label {
        margin-bottom: 8px;
        color: #888;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .result-box {
        position: relative;
        padding: 15px 90px 15px 15px;
        background: #090909;
        border: 1px solid #222;
        border-radius: 9px;
        white-space: pre-wrap;
        line-height: 1.5;
        font-size: 14px;
    }

    .copy-btn {
        position: absolute;
        right: 8px;
        top: 8px;
        padding: 7px 10px;
        background: #1d1d1d;
        color: white;
        font-size: 12px;
    }

    .copy-btn:hover {
        background: #2a2a2a;
    }

    .thumbnail-wrapper {
        margin-top: 10px;
        overflow: hidden;
        border-radius: 10px;
        border: 1px solid #222;
        background: #000;
    }

    #thumbnailPreview {
        display: block;
        width: 100%;
        height: auto;
    }

    .download-btn {
        width: 100%;
        margin-top: 12px;
        background: white;
        color: black;
    }

    .status {
        display: none;
        margin-top: 15px;
        text-align: center;
        color: #999;
        font-size: 14px;
    }

    .spinner {
        display: inline-block;
        width: 13px;
        height: 13px;
        border: 2px solid #555;
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        vertical-align: -2px;
        margin-right: 6px;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    footer {
        margin-top: 35px;
        text-align: center;
        color: #555;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        .container {
            margin: 30px auto;
        }

        h1 {
            font-size: 26px;
        }

        .time-row {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>Study Stream Generator</h1>

    <div class="subtitle">
        Generate your YouTube study stream details and thumbnail.
    </div>

    <div class="card">

        <h2>New Study Session</h2>

        <div class="time-row">

            <div>
                <label for="startTime">Start Time</label>
                <input type="time" id="startTime" value="07:00">
            </div>

            <div>
                <label for="endTime">End Time</label>
                <input type="time" id="endTime" value="12:30">
            </div>

        </div>

        <div class="duration">
            Duration:
            <strong id="durationDisplay">5 HOUR 30 MIN</strong>
        </div>

        <label for="target">
            Today's Study Target
        </label>

        <textarea
            id="target"
            placeholder="Example: Complete Electrostatics lectures and solve PYQs."
        ></textarea>

        <button
            class="generate-btn"
            id="generateBtn"
            onclick="generateEverything()"
        >
            Generate
        </button>

        <div class="status" id="status">
            <span class="spinner"></span>
            Generating thumbnail...
        </div>

    </div>


    <div class="card result" id="result">

        <div class="result-section">

            <div class="result-label">
                Title
            </div>

            <div class="result-box">

                <span id="titleOutput"></span>

                <button
                    class="copy-btn"
                    onclick="copyText('titleOutput', this)"
                >
                    Copy
                </button>

            </div>

        </div>


        <div class="result-section">

            <div class="result-label">
                Description
            </div>

            <div class="result-box">

                <span id="descriptionOutput"></span>

                <button
                    class="copy-btn"
                    onclick="copyText('descriptionOutput', this)"
                >
                    Copy
                </button>

            </div>

        </div>


        <div class="result-section">

            <div class="result-label">
                Thumbnail
            </div>

            <div class="thumbnail-wrapper">

                <img
                    id="thumbnailPreview"
                    alt="Generated study stream thumbnail"
                >

            </div>

            <button
                class="download-btn"
                onclick="downloadThumbnail()"
            >
                Download Thumbnail
            </button>

        </div>

    </div>


    <footer>
        Built by ADITYA
    </footer>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const MASTER_THUMBNAIL = "master-thumbnail.png";

const CANVAS_WIDTH = 1536;
const CANVAS_HEIGHT = 865;

let generatedThumbnailURL = null;


/* =========================================================
   DATE
========================================================= */

function getTodayDate() {

    const today = new Date();

    const day =
        String(today.getDate()).padStart(2, "0");

    const months = [
        "JANUARY",
        "FEBRUARY",
        "MARCH",
        "APRIL",
        "MAY",
        "JUNE",
        "JULY",
        "AUGUST",
        "SEPTEMBER",
        "OCTOBER",
        "NOVEMBER",
        "DECEMBER"
    ];

    const month =
        months[today.getMonth()];

    const year =
        today.getFullYear();

    return `${day} ${month} ${year}`;
}


/* =========================================================
   DURATION
========================================================= */

function calculateDuration() {

    const start =
        document.getElementById("startTime").value;

    const end =
        document.getElementById("endTime").value;

    if (!start || !end) {
        return 0;
    }

    const [startHour, startMinute] =
        start.split(":").map(Number);

    const [endHour, endMinute] =
        end.split(":").map(Number);

    let startTotal =
        startHour * 60 + startMinute;

    let endTotal =
        endHour * 60 + endMinute;

    if (endTotal <= startTotal) {
        endTotal += 1440;
    }

    return endTotal - startTotal;
}


function durationText(totalMinutes) {

    const hours =
        Math.floor(totalMinutes / 60);

    const minutes =
        totalMinutes % 60;

    let result = "";

    if (hours > 0) {

        result += `${hours} HOUR`;

        if (hours !== 1) {
            result += "S";
        }
    }

    if (minutes > 0) {

        if (result) {
            result += " ";
        }

        result += `${minutes} MIN`;
    }

    return result || "0 MIN";
}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(time) {

    const [hour, minute] =
        time.split(":").map(Number);

    const suffix =
        hour >= 12 ? "PM" : "AM";

    let displayHour =
        hour % 12;

    if (displayHour === 0) {
        displayHour = 12;
    }

    return `${displayHour}:${String(minute).padStart(2, "0")} ${suffix}`;
}


/* =========================================================
   LIVE DURATION
========================================================= */

function updateDuration() {

    const minutes =
        calculateDuration();

    document.getElementById(
        "durationDisplay"
    ).textContent =
        durationText(minutes);
}

document.getElementById("startTime")
    .addEventListener("change", updateDuration);

document.getElementById("endTime")
    .addEventListener("change", updateDuration);

updateDuration();


/* =========================================================
   TITLE
========================================================= */

function generateTitle(duration, date) {

    return `Study With Me | ${duration} Session | ${date} | JEE 2028`;
}


/* =========================================================
   DESCRIPTION
========================================================= */

function generateDescription(
    duration,
    start,
    end,
    date,
    target
) {

    return `Study with me for a focused ${duration} JEE 2028 study session.

📅 Date: ${date}
🕐 Session: ${start} → ${end}
📚 JEE 2028 Preparation
🎧 No talking • Deep focus

Today's targets:
${target || "Focused JEE 2028 preparation"}

Grab your books and study along with me.

#JEE2028 #StudyWithMe #JEE`;
}


/* =========================================================
   IMAGE LOADER
========================================================= */

function loadImage(src) {

    return new Promise((resolve, reject) => {

        const image = new Image();

        image.onload = () => resolve(image);

        image.onerror = () => {

            reject(
                new Error(
                    "master-thumbnail.png could not be loaded. Make sure it is in the same GitHub repository as index.html."
                )
            );
        };

        image.src = src;
    });
}


/* =========================================================
   FONT
========================================================= */

async function loadThumbnailFont() {

    try {

        await document.fonts.load(
            '100px "Anton"'
        );

    } catch (error) {

        console.log(
            "Anton font could not be loaded. Using fallback."
        );
    }
}


/* =========================================================
   FIT TEXT
========================================================= */

function fitText(
    ctx,
    text,
    maxWidth,
    startingSize
) {

    let size = startingSize;

    while (size > 20) {

        ctx.font =
            `normal ${size}px "Anton", Impact, sans-serif`;

        if (
            ctx.measureText(text).width <= maxWidth
        ) {
            break;
        }

        size--;
    }

    return size;
}


/* =========================================================
   DRAW THUMBNAIL TEXT
========================================================= */

function drawThumbnailText(
    ctx,
    text,
    x,
    baseline,
    maxWidth,
    startingSize
) {

    const size =
        fitText(
            ctx,
            text,
            maxWidth,
            startingSize
        );

    ctx.font =
        `normal ${size}px "Anton", Impact, sans-serif`;

    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";

    ctx.fillStyle = "#ffffff";

    ctx.shadowColor = "rgba(0,0,0,0.15)";
    ctx.shadowBlur = 1;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 1;

    ctx.fillText(
        text,
        x,
        baseline
    );

    ctx.shadowColor = "transparent";
    ctx.shadowBlur = 0;
}


/* =========================================================
   CREATE THUMBNAIL
========================================================= */

async function createThumbnail(
    duration,
    start,
    end,
    date
) {

    await loadThumbnailFont();

    const image =
        await loadImage(MASTER_THUMBNAIL);


    const canvas =
        document.createElement("canvas");


    canvas.width =
        CANVAS_WIDTH;

    canvas.height =
        CANVAS_HEIGHT;


    const ctx =
        canvas.getContext("2d");


    /*
       Draw clean master artwork.
    */

    ctx.drawImage(
        image,
        0,
        0,
        CANVAS_WIDTH,
        CANVAS_HEIGHT
    );


    /*
       EXACT TEXT POSITIONS
       Based on your uploaded 1536 × 865 thumbnail.
    */

    const x = 78;

    const maxWidth = 1050;


    /*
       1. STUDY WITH ME
    */

    drawThumbnailText(
        ctx,
        "STUDY WITH ME",
        x,
        198,
        maxWidth,
        118
    );


    /*
       2. DURATION
    */

    drawThumbnailText(
        ctx,
        duration,
        x,
        374,
        maxWidth,
        125
    );


    /*
       3. SESSION
    */

    drawThumbnailText(
        ctx,
        "SESSION",
        x,
        518,
        maxWidth,
        118
    );


    /*
       4. TIME
    */

    drawThumbnailText(
        ctx,
        `${start} → ${end}`,
        x,
        610,
        maxWidth,
        67
    );


    /*
       5. DATE
    */

    drawThumbnailText(
        ctx,
        date,
        x,
        703,
        maxWidth,
        67
    );


    /*
       Export final PNG.
    */

    return new Promise((resolve, reject) => {

        canvas.toBlob(
            blob => {

                if (!blob) {

                    reject(
                        new Error(
                            "Could not create PNG."
                        )
                    );

                    return;
                }

                resolve(blob);

            },
            "image/png"
        );
    });
}


/* =========================================================
   MAIN GENERATOR
========================================================= */

async function generateEverything() {

    const button =
        document.getElementById(
            "generateBtn"
        );

    const status =
        document.getElementById(
            "status"
        );

    const result =
        document.getElementById(
            "result"
        );


    const startValue =
        document.getElementById(
            "startTime"
        ).value;


    const endValue =
        document.getElementById(
            "endTime"
        ).value;


    const target =
        document.getElementById(
            "target"
        ).value.trim();


    if (!startValue || !endValue) {

        alert(
            "Please select both start and end times."
        );

        return;
    }


    const minutes =
        calculateDuration();


    if (minutes <= 0) {

        alert(
            "Please enter a valid session duration."
        );

        return;
    }


    const duration =
        durationText(minutes);


    const start =
        formatTime(startValue);


    const end =
        formatTime(endValue);


    const date =
        getTodayDate();


    /*
       Loading state.
    */

    button.disabled = true;

    status.style.display = "block";

    result.style.display = "none";


    try {

        /*
           These happen instantly.
        */

        const title =
            generateTitle(
                duration,
                date
            );


        const description =
            generateDescription(
                duration,
                start,
                end,
                date,
                target
            );


        /*
           This creates the actual image.
        */

        const thumbnailBlob =
            await createThumbnail(
                duration,
                start,
                end,
                date
            );


        /*
           Create browser URL.
        */

        if (generatedThumbnailURL) {

            URL.revokeObjectURL(
                generatedThumbnailURL
            );
        }


        generatedThumbnailURL =
            URL.createObjectURL(
                thumbnailBlob
            );


        /*
           Display title.
        */

        document.getElementById(
            "titleOutput"
        ).textContent =
            title;


        /*
           Display description.
        */

        document.getElementById(
            "descriptionOutput"
        ).textContent =
            description;


        /*
           Display thumbnail.
        */

        document.getElementById(
            "thumbnailPreview"
        ).src =
            generatedThumbnailURL;


        result.style.display =
            "block";


        result.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    }

    catch (error) {

        console.error(error);

        alert(
            "Thumbnail generation failed.\n\n" +
            error.message
        );

    }

    finally {

        button.disabled = false;

        status.style.display = "none";
    }
}


/* =========================================================
   COPY
========================================================= */

async function copyText(
    elementId,
    button
) {

    const text =
        document.getElementById(
            elementId
        ).textContent;


    await navigator.clipboard.writeText(
        text
    );


    const oldText =
        button.textContent;


    button.textContent =
        "Copied!";


    setTimeout(() => {

        button.textContent =
            oldText;

    }, 1200);
}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadThumbnail() {

    if (!generatedThumbnailURL) {
        return;
    }


    const date =
        getTodayDate();


    const filename =
        `JEE-2028-Study-With-Me-${date.replaceAll(" ", "-")}.png`;


    const link =
        document.createElement("a");


    link.href =
        generatedThumbnailURL;


    link.download =
        filename;


    document.body.appendChild(link);

    link.click();

    link.remove();
}

</script>

</body>
</html>
