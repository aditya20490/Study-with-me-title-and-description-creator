<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Stream Generator</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #080808;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

.page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
}

.container {
    width: 100%;
    max-width: 720px;
    padding: 35px 20px 60px;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
    font-weight: 700;
}

.header p {
    margin: 10px 0 0;
    color: #999;
    font-size: 16px;
}

.card {
    width: 100%;
    background: #151515;
    border: 1px solid #2b2b2b;
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.card h2 {
    margin: 0 0 25px;
    font-size: 25px;
}

label {
    display: block;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 9px;
}

input,
textarea {
    width: 100%;
    background: #0c0c0c;
    color: #ffffff;
    border: 1px solid #363636;
    border-radius: 9px;
    padding: 14px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
}

input:focus,
textarea:focus {
    border-color: #777;
}

textarea {
    resize: vertical;
    min-height: 100px;
}

.time-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.field {
    margin-bottom: 20px;
}

.duration {
    width: 100%;
    background: #090909;
    border-radius: 9px;
    padding: 18px;
    text-align: center;
    font-size: 25px;
    font-weight: 700;
    margin: 5px 0 22px;
}

.generate-button {
    width: 100%;
    border: none;
    border-radius: 9px;
    padding: 16px;
    background: #ffffff;
    color: #000000;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
}

.generate-button:active {
    transform: scale(0.99);
}

.results {
    display: none;
    margin-top: 25px;
}

.result-section {
    margin-bottom: 25px;
}

.result-section h3 {
    margin: 0 0 10px;
    font-size: 18px;
}

.output {
    background: #090909;
    border: 1px solid #303030;
    border-radius: 9px;
    padding: 15px;
    white-space: pre-wrap;
    line-height: 1.5;
    word-break: break-word;
}

.button-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.small-button {
    flex: 1;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-weight: 700;
    cursor: pointer;
}

.copy-button {
    background: #292929;
    color: #ffffff;
}

.download-button {
    background: #a00000;
    color: #ffffff;
}

.thumbnail-wrapper {
    width: 100%;
    overflow: hidden;
    border-radius: 9px;
    background: #000000;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
}

.note {
    color: #777;
    font-size: 13px;
    line-height: 1.5;
    margin-top: 10px;
}

@media (max-width: 600px) {

    .container {
        padding: 25px 16px 50px;
    }

    .header h1 {
        font-size: 27px;
    }

    .card {
        padding: 22px;
    }

    .time-grid {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .button-row {
        flex-direction: column;
    }

}

</style>
</head>


<body>

<div class="page">

<div class="container">

    <div class="header">

        <h1>Study Stream Generator</h1>

        <p>
            Generate your stream details in seconds.
        </p>

    </div>


    <div class="card">

        <h2>New Study Session</h2>


        <div class="time-grid">

            <div class="field">

                <label for="startTime">
                    Start Time
                </label>

                <input
                    type="time"
                    id="startTime"
                    value="17:00"
                >

            </div>


            <div class="field">

                <label for="endTime">
                    End Time
                </label>

                <input
                    type="time"
                    id="endTime"
                    value="19:30"
                >

            </div>

        </div>


        <div
            class="duration"
            id="duration"
        >
            2 HOURS 30 MIN
        </div>


        <div class="field">

            <label for="target">
                Today's Study Target
            </label>

            <textarea
                id="target"
                placeholder="Example: Physics - NLM&#10;Chemistry - Atomic Structure&#10;Maths - Straight Lines"
            ></textarea>

        </div>


        <button
            class="generate-button"
            onclick="generateStream()"
        >
            GENERATE STREAM
        </button>

    </div>


    <div
        class="results"
        id="results"
    >

        <div class="card">


            <div class="result-section">

                <h3>Title</h3>

                <div
                    class="output"
                    id="titleOutput"
                ></div>

                <div class="button-row">

                    <button
                        class="small-button copy-button"
                        onclick="copyText('titleOutput')"
                    >
                        COPY TITLE
                    </button>

                </div>

            </div>


            <div class="result-section">

                <h3>Description</h3>

                <div
                    class="output"
                    id="descriptionOutput"
                ></div>

                <div class="button-row">

                    <button
                        class="small-button copy-button"
                        onclick="copyText('descriptionOutput')"
                    >
                        COPY DESCRIPTION
                    </button>

                </div>

            </div>


            <div class="result-section">

                <h3>Thumbnail</h3>

                <div class="thumbnail-wrapper">

                    <canvas
                        id="thumbnailCanvas"
                        width="1280"
                        height="720"
                    ></canvas>

                </div>


                <div class="button-row">

                    <button
                        class="small-button download-button"
                        onclick="downloadThumbnail()"
                    >
                        DOWNLOAD THUMBNAIL
                    </button>

                </div>


                <div class="note">

                    Keep
                    <b>thumbnail-template.png</b>
                    in the same GitHub repository
                    as this index.html.

                </div>

            </div>


        </div>

    </div>

</div>

</div>


<script>

const TITLE_TEMPLATE =
    "Study With Me | {DURATION} Session | JEE 2028";


const DESCRIPTION_TEMPLATE =
`Study with me for a focused {DURATION} JEE 2028 study session.

🕐 Session: {START} – {END}
📚 JEE 2028 Preparation
🎧 No talking • Deep focus

Today's targets:
{TARGET}

Grab your books and study along with me.

#JEE2028 #StudyWithMe #JEE`;


function calculateDuration() {

    const start =
        document.getElementById("startTime").value;

    const end =
        document.getElementById("endTime").value;


    if (!start || !end) {
        return null;
    }


    const startParts =
        start.split(":");

    const endParts =
        end.split(":");


    let startMinutes =
        Number(startParts[0]) * 60 +
        Number(startParts[1]);


    let endMinutes =
        Number(endParts[0]) * 60 +
        Number(endParts[1]);


    if (endMinutes <= startMinutes) {
        endMinutes += 1440;
    }


    const totalMinutes =
        endMinutes - startMinutes;


    const hours =
        Math.floor(totalMinutes / 60);


    const minutes =
        totalMinutes % 60;


    return {
        hours: hours,
        minutes: minutes
    };
}


function durationText(duration) {

    let result = "";


    if (duration.hours > 0) {

        result +=
            duration.hours +
            " HOUR";


        if (duration.hours !== 1) {
            result += "S";
        }

    }


    if (duration.minutes > 0) {

        if (result !== "") {
            result += " ";
        }


        result +=
            duration.minutes +
            " MIN";
    }


    return result;
}


function formatTime(time) {

    const parts =
        time.split(":");


    let hour =
        Number(parts[0]);


    const minute =
        Number(parts[1]);


    const suffix =
        hour >= 12
            ? "PM"
            : "AM";


    hour =
        hour % 12;


    if (hour === 0) {
        hour = 12;
    }


    return (
        hour +
        ":" +
        String(minute).padStart(2, "0") +
        " " +
        suffix
    );
}


function updateDuration() {

    const duration =
        calculateDuration();


    if (!duration) {
        return;
    }


    document.getElementById(
        "duration"
    ).textContent =
        durationText(duration);
}


function generateStream() {

    const start =
        document.getElementById(
            "startTime"
        ).value;


    const end =
        document.getElementById(
            "endTime"
        ).value;


    const target =
        document.getElementById(
            "target"
        ).value.trim();


    const duration =
        calculateDuration();


    if (!duration) {

        alert(
            "Please enter the start and end time."
        );

        return;
    }


    const durationString =
        durationText(duration);


    const formattedStart =
        formatTime(start);


    const formattedEnd =
        formatTime(end);


    const title =
        TITLE_TEMPLATE
        .replaceAll(
            "{DURATION}",
            durationString
        );


    const description =
        DESCRIPTION_TEMPLATE
        .replaceAll(
            "{DURATION}",
            durationString
        )
        .replaceAll(
            "{START}",
            formattedStart
        )
        .replaceAll(
            "{END}",
            formattedEnd
        )
        .replaceAll(
            "{TARGET}",
            target ||
            "Focused JEE 2028 preparation"
        );


    document.getElementById(
        "titleOutput"
    ).textContent =
        title;


    document.getElementById(
        "descriptionOutput"
    ).textContent =
        description;


    document.getElementById(
        "results"
    ).style.display =
        "block";


    generateThumbnail(
        durationString
    );


    document.getElementById(
        "results"
    ).scrollIntoView({
        behavior: "smooth"
    });
}


function generateThumbnail(
    durationString
) {

    const canvas =
        document.getElementById(
            "thumbnailCanvas"
        );


    const ctx =
        canvas.getContext("2d");


    const image =
        new Image();


    image.onload =
        function() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.fillStyle =
                "#000000";


            ctx.fillRect(
                40,
                205,
                720,
                250
            );


            ctx.fillStyle =
                "#ffffff";


            ctx.font =
                "bold 175px Arial";


            ctx.textBaseline =
                "top";


            ctx.fillText(
                durationString,
                55,
                210
            );

        };


    image.onerror =
        function() {

            ctx.fillStyle =
                "#090909";


            ctx.fillRect(
                0,
                0,
                1280,
                720
            );


            ctx.fillStyle =
                "#ffffff";


            ctx.font =
                "bold 95px Arial";


            ctx.fillText(
                "STUDY WITH ME",
                55,
                70
            );


            ctx.font =
                "bold 150px Arial";


            ctx.fillText(
                durationString,
                55,
                220
            );


            ctx.font =
                "bold 100px Arial";


            ctx.fillText(
                "SESSION",
                55,
                410
            );

        };


    image.src =
        "thumbnail-template.png";
}


function copyText(elementId) {

    const text =
        document.getElementById(
            elementId
        ).textContent;


    navigator.clipboard
        .writeText(text)
        .then(
            function() {

                alert(
                    "Copied! ✅"
                );

            }
        )
        .catch(
            function() {

                alert(
                    "Copy failed. Please select and copy it manually."
                );

            }
        );
}


function downloadThumbnail() {

    const canvas =
        document.getElementById(
            "thumbnailCanvas"
        );


    const link =
        document.createElement("a");


    link.download =
        "study-with-me-thumbnail.png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();
}


document
    .getElementById("startTime")
    .addEventListener(
        "change",
        updateDuration
    );


document
    .getElementById("endTime")
    .addEventListener(
        "change",
        updateDuration
    );


updateDuration();

</script>

</body>

</html>
